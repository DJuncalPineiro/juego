
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1">

<title>El misterio del tesoro</title>

<style>
  body {
    margin: 0;
    min-height: 100vh;
    background: black;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: Georgia, serif;
  }

  /* Foto original */
  .foto {
    max-width: 95%;
    max-height: 85vh;
    object-fit: contain;
    margin: 40px auto 20px;
  }

  /* Confesión misteriosa */
  #confesion {
    max-width: 650px;
    padding: 0 25px;
    margin: 10px auto 40px;
    text-align: center;
    font-size: 20px;
    line-height: 1.8;
    white-space: pre-wrap;
    min-height: 100px;
  }

  /* Cursor parpadeante */
  #confesion::after {
    content: "▌";
    animation: parpadeo 0.7s infinite;
  }

  #confesion.terminado::after {
    content: "";
  }

  @keyframes parpadeo {
    50% { opacity: 0; }
  }

  /* Botón invisible */
  #botonSecreto {
    position: fixed;
    top: 0;
    right: 0;
    width: 45px;
    height: 45px;
    background: black;
    border: none;
    cursor: pointer;
    z-index: 10;
  }

  /* Panel de cajas */
  #panel {
    display: none;
    position: fixed;
    top: 55px;
    right: 10px;
    gap: 8px;
    z-index: 10;
  }

  .caja {
    width: 38px;
    height: 38px;
    background: white;
    border: 1px solid gray;
    cursor: pointer;
  }

  /* Segunda fase */
  #faseSecreta {
    display: none;
    width: 100%;
    flex-direction: column;
    align-items: center;
    margin-bottom: 60px;
  }

  #fotoSecreta {
    max-width: 95%;
    max-height: 85vh;
    object-fit: contain;
    margin: 30px auto;
  }

  /* Formulario de contraseña */
  #formulario {
    width: min(90%, 400px);
    text-align: center;
    margin: 20px auto;
  }

  #contrasena {
    box-sizing: border-box;
    width: 100%;
    padding: 14px;
    background: #171717;
    border: 1px solid #777;
    border-radius: 6px;
    color: white;
    font-size: 17px;
    text-align: center;
  }

  #comprobar {
    margin-top: 15px;
    padding: 12px 35px;
    background: white;
    color: black;
    border: none;
    border-radius: 6px;
    font-size: 16px;
    cursor: pointer;
  }

  #comprobar:hover {
    background: #ccc;
  }

  #resultado {
    margin-top: 20px;
    font-size: 18px;
    min-height: 25px;
  }

  @media (max-width: 600px) {
    #confesion {
      font-size: 17px;
    }

    .caja {
      width: 32px;
      height: 32px;
    }
  }
</style>
</head>

<body>

<!-- Botón invisible -->
<button id="botonSecreto"
        aria-label="Abrir panel secreto">
</button>

<!-- Cajas de colores -->
<div id="panel">
  <button class="caja"></button>
  <button class="caja"></button>
  <button class="caja"></button>
  <button class="caja"></button>
  <button class="caja"></button>
</div>

<!-- Primera foto -->
<img src="foto.jpg" class="foto"
     alt="Imagen del misterio">

<!-- Confesión -->
<div id="confesion"></div>

<!-- Segunda fase oculta -->
<div id="faseSecreta">

  <img src="nueve.png"
       id="fotoSecreta"
       alt="Imagen desbloqueada">

  <form id="formulario">
    <p>Introduce la contraseña secreta:</p>

    <input
      type="text"
      id="contrasena"
      placeholder="Contraseña..."
      autocomplete="off"
      required
    >

    <button type="submit" id="comprobar">
      Comprobar
    </button>

    <div id="resultado" aria-live="polite"></div>
  </form>

</div>

<script>
  // 1. CONFESIÓN LETRA POR LETRA

 const texto = `Sí... he sido yo!!!

Yo me llevé el tesoro, ¿vale?!

Alguien debería haberme detenido,
pero ahora ya es demasiado tarde.

¡Mejor en mis manos que en las vuestras!

Buscaré un lugar tan seguro
como apropiado, a la espalda
del mismísimo rey si es necesario...

Pero debo apresurarme.
Está saliendo el sol y debo
volver a la cama...

o él despertará...

-Yunpinus O'Gueid`
      
  const confesion =
    document.getElementById("confesion");

  let posicion = 0;

  function escribirTexto() {
    if (posicion < texto.length) {
      confesion.textContent += texto[posicion];
      posicion++;

      setTimeout(escribirTexto, 55);
    } else {
      confesion.classList.add("terminado");
    }
  }

  // Comenzar la confesión
  setTimeout(escribirTexto, 1000);


  // 2. BOTÓN INVISIBLE Y CAJAS

  const boton =
    document.getElementById("botonSecreto");

  const panel =
    document.getElementById("panel");

  const cajas =
    document.querySelectorAll(".caja");

  const faseSecreta =
    document.getElementById("faseSecreta");

  const colores = ["white", "black", "blue", "violet", "green"];

  const estados = [0, 0, 0, 0, 0];

  // Azul Negro Azul Blanco Violeta
  const solucion = [2, 1, 2, 0, 3];

  boton.addEventListener("click", () => {
    panel.style.display =
      panel.style.display === "flex"
        ? "none"
        : "flex";
  });

  cajas.forEach((caja, i) => {
    caja.addEventListener("click", () => {

      estados[i] = (estados[i] + 1) % 5;

      caja.style.backgroundColor =
        colores[estados[i]];

      comprobarColores();
    });
  });

  function comprobarColores() {
    const correcto = estados.every(
      (valor, i) => valor === solucion[i]
    );

    if (correcto) {
      faseSecreta.style.display = "flex";
    } else {
      faseSecreta.style.display = "none";
    }
  }


  // 3. COMPROBAR CONTRASEÑA

  const formulario =
    document.getElementById("formulario");

  const contrasena =
    document.getElementById("contrasena");

  const resultado =
    document.getElementById("resultado");

  formulario.addEventListener(
    "submit", (evento) => {
      evento.preventDefault();

      // Ignorar mayúsculas y espacios extra
      const respuesta = contrasena.value
        .trim()
        .toLowerCase()
        .replace(/\s+/g, " ");

      const correcta =
        respuesta === "absoluta pipu1" ||
        respuesta === "pipu1 absoluta";

      if (correcta) {
        resultado.textContent =
          "Enhorabuena, el último dígito es... bueno, dime tú: ¿Qué día es hoy?";
        resultado.style.color = "#4ade80"; 
      } else {
        resultado.textContent =
          "Contraseña incorrecta. Inténtalo de nuevo.";
        resultado.style.color = "#f87171";
      }
    }
  );
</script>

</body>
</html>
